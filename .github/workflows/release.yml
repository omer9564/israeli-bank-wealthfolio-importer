name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml

  # `@v1` consumers (both the composite action and the reusable workflow)
  # pin `ghcr.io/.../israeli-bank-wealthfolio-importer:v1`, so that tag must
  # actually be published alongside the exact version and `latest` — an
  # expression can't strip the patch/minor off `github.ref_name` inline, so
  # it's computed here and passed to the publish job as a job output.
  major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.major.outputs.tag }}
    steps:
      - id: major
        run: echo "tag=${GITHUB_REF_NAME%%.*}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [ci, major-tag]
    uses: ./.github/workflows/docker-build.yml
    # docker-build.yml declares no permissions of its own so that fork PRs
    # keep a read-only token; every caller grants exactly what it needs.
    permissions:
      contents: read
      packages: write
    with:
      push: true
      tags: |
        ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        ghcr.io/${{ github.repository }}:latest
        ghcr.io/${{ github.repository }}:${{ needs.major-tag.outputs.tag }}

  move-major-tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # `@v1` consumers track this tag, so it must move only after the image
      # it points at is actually published.
      - name: Move the major tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR"
          git push origin -f "$MAJOR"
