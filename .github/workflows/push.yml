name: push

on:
  push:
    branches: [main]

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml
  docker:
    needs: ci
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
      tags: ghcr.io/${{ github.repository }}:main
