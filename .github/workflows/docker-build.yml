name: docker-build

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      tags:
        type: string
        default: ""

jobs:
  # Permissions are intentionally granted per-caller, not here: a reusable
  # workflow can only have its GITHUB_TOKEN permissions downgraded by the
  # caller, never elevated, and fork PRs always get a read-only token
  # regardless of what this job declares. A static `packages: write` here
  # would make GitHub reject the run before any step executes, for every
  # fork PR. Each caller in pull-request.yml/push.yml grants exactly what
  # it needs instead — do not reinstate a block here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # PRs validate amd64 only; publishing builds both, since emulated
          # arm64 builds are slow enough to hurt PR feedback.
          platforms: ${{ inputs.push && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
