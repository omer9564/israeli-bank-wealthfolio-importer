name: node-ci

on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Bun runs the scripts, but ultracite/biome resolve `#!/usr/bin/env node`,
      # so a real node must be on PATH.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run check
      # `bun run typecheck` also typechecks packages/core on its own stricter
      # config, which is what keeps `Bun`/`process` out of the addon bundle.
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
